# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: "%env(APP_SECRET)%"
    asset_mapper:
        enabled: true

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        # Ne pas envoyer les cookies sur les assets - limiter le cookie_path
        # Malheureusement, on ne peut pas exclure /assets/ du cookie_path directement
        # La seule solution serait un sous-domaine séparé pour les assets
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
